# Pseudo-measurement experiment config (paths and options).
# Main retrieval/LUT config is given by main_config_path.

[pseudo_measurement]
# Path to MERRA2-derived transmittance NetCDF (profile × band; 72 layers; see Generate_transmittance.jl).
trans_nc = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/convolved_transmittance/transmittance_summer_FineWvResModel_FullRange_Aug01.nc"
# Main MWE config used for prepare_mwe_inputs (LUTs, kernel, SIF basis, fit).
main_config_path = "../Simple_PACE_xSecFit_MWE_zcheVer.toml"
# Profile index to use for synthetic radiance (1-based; use 1 if only one profile).
profile_index = 1
# AMF for synthetic (1/cos(VZA)); use 1.0 for nadir.
amf = 1.0
# SIF coefficients to inject (one per SIF EV; length must match sif_nev in main config).
sif_coeff_true = [1.0]
# Add Gaussian noise to synthetic spectrum (sigma = noise_sigma * (c1 + c2*y)); set 0 to disable.
noise_scale = 0.0
# Number of synthetic samples to generate and retrieve (Create_synthetic_radiance.jl).
n_samples = 5

[sif_addition]
# mode: "date" = all granules for a date (parallel_granules), "granule" = single granule by ID, "single_pixel" = one pixel only
mode = "granule"
# Date mode: date = YYYYMMDD. Granule mode: granule_id required.
granule_id = "20250927T123954"
# date = "20250927"  # YYYYMMDD when mode=date
L1B_dir = "/home/zhe2/data/PACE/L1B_V3"
L2AOP_dir = "/home/zhe2/data/PACE/L2_AOP_V3.1"
L2BGC_dir = "/home/zhe2/data/PACE/L2_BGC_V3.1"
output_dir = "/home/zhe2/FraLab/PACE_redSIF_PACE/demo_example/pseudo_measurement/sif_addition_output"
interim_dir = "/home/zhe2/FraLab/PACE_redSIF_PACE/demo_example/pseudo_measurement/sif_addition_interim"
# Date mode: parallel_granules = true uses Threads.@threads over granules (pixel-level threads disabled per granule)
parallel_granules = true
# use_in_memory_merge: true = read L1B/L2 directly, write single interim; false = subset files then merge
use_in_memory_merge = true
# SIF addition: magnitude and shape source
sif_magnitude = 0.5
sif_shape_source = "jld2"  # "jld2" = use SIF_shapes from file, "basis" = fixed sif_coeff_add
sif_jld2_path = ""  # optional override; empty = use from main config data.sif_file
add_snr_noise = true
# Pixel filter: only pixels with valid nflh != 0
pixel_filter_vars = ["nflh"]
nflh_nonzero = true
# Optional: subset of scans for quick testing (1-based inclusive). Omit for full swath.
scan_start = 1
scan_end = 5
# Single-pixel mode: pace file and pixel/scan indices
pace_file = "sample_granule_20240830T131442_new_chl.nc"
pixel_index = 1259
scan_index = 1699
sif_coeff_add = [0.5]
max_iter = 20
