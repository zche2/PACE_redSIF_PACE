# Global fit pipeline config. Extends base MWE config with [global_fit] and [batch_fit].
# Use as: julia -t N demo_example/global_fit/Run_global_fit.jl demo_example/global_fit/global_fit_config.toml
# Or set PACE_GLOBAL_FIT_CONFIG to this file path.

[global_fit]
mode = "granule"  # "date" = all granules for date, "granule" = single granule by ID
date = "20250927"  # YYYYMMDD when mode=date
granule_id = "20250927T123954"  # e.g. "20250927T131442" when mode=granule
L1B_dir = "/home/zhe2/data/PACE/L1B_V3"
L2AOP_dir = "/home/zhe2/data/PACE/L2_AOP_V3.1"
L2BGC_dir = "/home/zhe2/data/PACE/L2_BGC_V3.1"
output_dir = "/home/zhe2/data/PACE/xSec_fit_output"
interim_dir = "/home/zhe2/data/PACE/xSec_fit_interim"
use_threads = true
parallel_granules = true
# If true, read L1B/L2 directly and write single interim (no subset files). Default: true for granule, false for date+parallel.
use_in_memory_merge = true

[pace_observation]
# Overridden for preprocessed interim file (Rtoa_red from rhot)
spectrum_var = "Rtoa_red"
wavelength_var = "red_wavelength"

[batch_fit]
output_dir = "demo_example/global_fit_output"
output_suffix_parallel = "_retrieval_full_parallel.nc"
pixel_filter_vars = ["nflh"]
use_threads = true
max_outer_steps = 10
dark_filter_enabled = false
ocean_filter_enabled = false
watermask_var = "watermask"
ocean_mask_values = [1]

[fit]
# Iteration method for toy/MWE-style fits when merged with base config: "lm", "gn", or "lbfgsb".
fit_method = "lm"
# Gauss-Newton step scale (default 1.0); use < 1 when merging with base MWE configs.
gn_damping = 1.0
# L-BFGS-B memory size and line-search controls.
lbfgs_m = 5
lbfgs_c1 = 1.0e-4
lbfgs_max_backtrack = 40
