# Example config for rasterize_svd_retrievals.jl
#
# Usage:
#   julia --project=. global_fit_pipeline/rasterize/rasterize_svd_retrievals.jl \
#         global_fit_pipeline/rasterize/rasterize.example.toml
#
# Temporal windowing:
#   Window centers are spaced chunk_frequency_days apart between start_date and end_date.
#   Each window collects all granules whose sensing date falls within
#   [center - half_chunk_days, center + half_chunk_days].
#   One output NetCDF is written per window:
#     sif678_raster_<YYYYMMDD>_<YYYYMMDD>.nc

[rasterize]
input_dir            = "/home/zhe2/data/PACE/svd_retrieval_output"
output_dir           = "/home/zhe2/data/PACE/svd_rasterized"
# Required when [rasterize.filters].exclude_missing_nflh = true (same tree as [general].L2AOP_dir).
# L2 files are matched exactly first, then by granule id ignoring the last 2 time digits (seconds).
l2aop_dir            = "/home/zhe2/data/PACE/L2_AOP_V3.1"
start_date           = "2025-07-15"      # center of first window (YYYY-MM-DD)
end_date             = "2025-07-16"      # center of last window  (YYYY-MM-DD)
chunk_frequency_days = 2                # days between window centers
half_chunk_days      = 15                 # half-width of each window in days

[rasterize.grid]
# Grid spacing = 180 / resolution degrees.
# resolution = 180  →  1.0° per cell  (360  × 180  grid)
# resolution = 360  →  0.5° per cell  (720  × 360  grid)
resolution = 900

[rasterize.filters]
# status_codes — keep only pixels whose retrieval status_code is in this list.
# (Written to each SVD granule NetCDF as variable "status_code"; see svd_swath_parallel.jl.)
#
# Code | converged (0/1) | Meaning
# -----|-----------------|----------------------------------------------------------
#   0  |       0         | Fit ran but used all max_outer_steps without hitting RMSE/dx
#      |                 | convergence tolerances (still has x_hat, rmse, etc.).
#   1  |       1         | Converged: stopped on RMSE/dx tolerances OR "stalled LM"
#      |                 | (χ² near stationary; inner step not accepted but accepted as done).
#   2  |       0         | LM inner loop never accepted a step; not classified as stalled.
#   3  |       0         | Never fit: invalid/missing spectrum after sorting, or non-finite SZA.
#      |                 | Also the default fill for pixels never processed in a scan line.
#   4  |       0         | Never completed fit: exception inside lm_one_step.
#   5  |       0         | Never fit: dark_filter_enabled and pixel not dark (is_dark == 0).
#   6  |       0         | Never fit: ocean_filter_enabled and pixel not ocean (is_ocean == 0).
#   7  |       0         | Never fit: pixel_filter_vars eligibility failed (missing L2 fields, etc.).
#
# Typical choices:
#   status_codes = [1]        — converged retrievals only (recommended for maps)
#   status_codes = [0, 1]     — converged + hit iteration cap (may include marginal fits)
#   omit status_codes + valid_status_only = false  — no status filter (all attempted pixels)
#
# Legacy: valid_status_only = true  → same as status_codes = [1]
#         valid_status_only = false → no status filter
status_codes = [1]
exclude_dark  = true   # skip pixels flagged is_dark == 1
ocean_only    = false   # keep only is_ocean == 1 (open water from retrieval watermask)
# exclude_ocean defaults to false when ocean_only = true; set exclude_ocean = true for land-only maps
max_sif       = 5.0    # drop pixels where |sif_radiance_678nm| > max_sif (W/m²/sr/µm)
max_chi2      = 2.0    # drop pixels where reduced_chi2 > max_chi2; omit key to disable
# Exclude pixels where L2 OC_AOP nflh is missing (_FillValue / non-finite); matches retrieval pixel_filter_vars
exclude_missing_nflh = true
nflh_var      = "nflh"
