# Copy to global_fit_pipeline.toml (or configs/) and edit paths.
#
# [general] — shared directories for Python download and Julia retrieval (required).
#
# --- Download ---
#   python global_svd_fit_pipeline/download/download_pace_products.py global_fit_pipeline/global_fit_pipeline.toml
#
# --- SVD retrieval ---
#   julia --project=. -t 8 global_svd_fit_pipeline/svd_retrieval/run_svd_fit.jl global_fit_pipeline/global_fit_pipeline.toml
#
# Retrieval physics: [data], [spectral], [fit], [batch_fit], …
# SVD swath retrieval is band-native (interim red bands + [spectral] λ window):
# no high-res grid, no O₂/H₂O LUT or kernel regeneration.
# Band SNR uses [data].pace_snr_file when [fit].use_band_snr or [kernel].use_band_snr is true.
# [download], [general], and [svd_retrieval] are orchestration-only;
# Julia builds the effective retrieval config in memory (no merged TOML).

# =============================================================================
[general]
L1B_dir   = "/home/zhe2/data/PACE/L1B_V3"
L2AOP_dir = "/home/zhe2/data/PACE/L2_AOP_V3.2"
L2BGC_dir = "/home/zhe2/data/PACE/L2_BGC_V3.2"

# =============================================================================
[download.temporal]
start = "2025-04-01T00:00:00"
end   = "2025-04-30T23:59:59"

[download.spatial]
# the bounding box [west, south, east, north] = [min_lon, min_lat, max_lon, max_lat]
use_bounding_box = true
bounding_box = [88.00, 21.50, 90.00, 22.70]

[download.collections]
l1b_short_name    = "PACE_OCI_L1B_SCI"
l1b_version       = "3"
l2_bgc_short_name = "PACE_OCI_L2_BGC"
l2_bgc_version    = "3.2"
l2_aop_short_name = "PACE_OCI_L2_AOP"
l2_aop_version    = "3.2"

# Optional overrides for download destinations.
# If omitted, [general] dirs are used: l1b_dir, l2_aop_dir, l2_bgc_dir.
[download.paths]
# l1b_dir   = "/custom/L1B"
# l2_bgc_dir = "/custom/L2_BGC"
# l2_aop_dir = "/custom/L2_AOP"

[download.options]
# login_strategy = "all"
skip_existing = true
# cloud_cover = [0, 70]

# =============================================================================
# [svd_retrieval] — mode chooses how inputs are discovered under [general] L1B_dir:
#   "granule" → single file:            set granule_id = "YYYYMMDDTHHMMSS"
#   "date"    → all granules for a day: set date = "YYYYMMDD"
#   "dates"   → date range or list:     set date_start + date_end  OR  dates = ["YYYYMMDD", ...]
[svd_retrieval]
mode = "dates"

# --- mode = "date" ---
# date = "20250702"

# --- mode = "granule" ---
# granule_id = "20250701T000124"

# --- mode = "dates" ---
date_start         = "20250401"
date_end           = "20250430"
date_interval_days = 1
# dates = ["20250701", "20250702"]

# Optional pixel/scan subsets (commented out = full swath):
# pixel_start = 1
# pixel_end   = 1272
# scan_start  = 1
# scan_end    = 100

output_dir  = "/home/zhe2/data/PACE/svd_retrieval_output/coastal_2025_04"
interim_dir = "/home/zhe2/data/PACE/svd_retrieval_interim_2"

# Granules run sequentially inside one process (HDF5/NetCDF are not safe with
# concurrent granule threads). Use parallel_pixels + `julia -t N` for intra-granule parallelism.
# For multi-granule throughput, run separate Julia jobs on separate date ranges.
parallel_granules  = false
parallel_pixels    = true
use_in_memory_merge = true
# Skip granule when any retrieval NetCDF exists: interim_<granule_id>_*.nc under output_dir.
skip_existing = true
# Progress bars (granules per day + scans per granule). Default: on when stdout is a TTY, off under nohup.
# Scan updates are serial (safe with parallel_pixels / julia -t N).
# show_progress = true

# GPU batched SVD tile path (requires CUDA.jl + working CUDA driver).
# Falls back to CPU per-pixel path with a @warn if CUDA.functional() is false.
# Recommended: -t 2 with GPU; -t 8–16 for CPU-only.
use_gpu          = false
gpu_tile_pixels  = 256   # reduce if out-of-memory; VRAM scales with n_λ × n_state × tile

# =============================================================================
[data]
base_dir    = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE"
# SVD transmittance PCs (NetCDFs on OCI band grid);
# interpolated to interim red_wavelength bands inside (λ_min, λ_max).
summer_nc      = "convolved_transmittance/transmittance_summer_FineWvResModel_FullRange_Aug01.nc"
winter_nc      = "convolved_transmittance/transmittance_winter_FineWvResModel_FullRange_Aug01.nc"
sif_file       = "Files_in_use/SIF_singular_vector.jld2"
pace_snr_file  = "Files_in_use/PACE_OCI_L1BLUT_baseline_SNR_1.1.txt"

[numerics]
float_type = "Float64"

[spectral]
lambda_min_nm          = 640.0
lambda_max_nm          = 756.0
sif_nev                = 1
normalize_sif_first_ev = true

[kernel]
# Default for band SNR when [fit] omits use_band_snr.
use_band_snr = true

[fit]
fit_method   = "lm"
use_band_snr = true

# Levenberg–Marquardt settings
lm_lambda0        = 1.0
lm_lambda_up      = 5.0
lm_lambda_down    = 0.7
lm_lambda_min     = 1e-8
lm_lambda_max     = 1e8
lm_max_inner      = 40

# Convergence
conv_dx_rel_tol   = 1e-6
conv_rmse_rel_tol = 1e-6
conv_rmse_abs_tol = 1e-6

# Stall detection
conv_stall_enable        = true
conv_stall_window        = 3
conv_stall_redchi2_target  = 5.0
conv_stall_redchi2_abs_tol = 0.1
conv_stall_redchi2_rel_tol = 0.03
conv_stall_dx_rel_tol    = 5e-3

# Priors
prior_min_sigma    = 0.001
prior_sigma_default = 1e12
sif_sigma          = 1e12

# Unused by SVD path (kept for compatibility)
n_plot_steps       = 50
gn_damping         = 1.0
lbfgs_m            = 5
lbfgs_c1           = 1.0e-4
lbfgs_max_backtrack = 40

[fit.svd]
alpha_prior_mean             = 1.5
alpha_prior_sigma            = 0.5
n_pc                         = 15
n_legendre                   = 5
svd_log_transform            = true
use_legendre01_prior         = true
legendre01_prior_sigma_fraction = 1.0
use_legendre_higher_prior    = true
legendre_higher_sigma        = 1.0
pc_prior_mode                = "loading_variance"
pc_prior_sigma_scale         = 1.0

# =============================================================================
[batch_fit]
# Output filename suffix (appended to interim granule stem).
output_suffix_parallel = "_svd_retrieval_pc15_npoly5_coastal_area.nc"

# GPU keys here are overridden by [svd_retrieval] values when present.
# Pixels must have non-missing values for each listed 2D variable in the interim file.
pixel_filter_vars   = []
use_threads         = true
max_outer_steps     = 15
dark_filter_enabled  = false
ocean_filter_enabled = false
watermask_var        = "watermask"
ocean_mask_values    = [1]

# --- I/O acceleration ---
# prefetch_input: read full Rtoa_red into RAM before the scan loop
#   (eliminates ~N_scan serial NetCDF reads). Default: true.
prefetch_input = true

# deferred_write: accumulate all per-scan outputs in memory, flush once after the loop
#   (eliminates ~N_scan × 12 serial NetCDF writes; improves compression ratio). Default: true.
deferred_write = true

# output_compression_level: zlib deflate 0–9 (0 = none, 1 = fastest, 9 = best ratio).
# Level 1 on large bulk arrays beats level 4 on tiny per-scan slices. Default: 1.
output_compression_level = 1
