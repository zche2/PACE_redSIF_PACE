# Match-up SIF retrieval (TROPOMI↔OCI co-location products)
# Driven by: julia -t N sif_retrieval/run_matchup_sif.jl config.sif_retrieval.toml
#        or: python run_matchup_sif.py --config config.sif_retrieval.toml -t 16

[matchup]
# Input matchup NetCDF from the colocation pipeline
matchup_nc = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/TROPOMI_OCI_colocation_data/runs/july2025_d01-31/products/matchup.nc"

# Outputs under the same july2025_d01-31 run folder.
# Folder name encodes fit.svd n_pc / n_legendre, e.g. sif_retrieval_nPC_15_npoly_5
# (runner rebuilds this from [fit.svd] if you only set output_root)
output_root = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/TROPOMI_OCI_colocation_data/runs/july2025_d01-31/chi2_correct_retrieval/"
# output_dir = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/TROPOMI_OCI_colocation_data/runs/july2025_d01-31/sif_retrieval_nPC_15_npoly_5"

# Reference L1B only for red F0(λ) + earth_sun_distance_correction (not for Rtoa).
l1b_solar_reference = "/home/zhe2/data/PACE/L1B_V3/PACE_OCI.20250701T000124.L1B.V3.nc"
# Optional: override ESD (omit to use L1B attribute)
# esd = 1.0

# Spectra to retrieve (each uses its paired SZA):
#   sim_noisy → lt_oci_sim_noisy + sza_trop
#   meas      → lt_oci_meas      + sza_pace
#   sim       → lt_oci_sim       + sza_trop
spectra = ["sim_noisy", "meas"]

# 0 = all matches; set small for a smoke test
max_matches = 0

[data]
base_dir = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/Files_in_use"
summer_nc = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/convolved_transmittance/transmittance_summer_FineWvResModel_FullRange_Aug01.nc"
winter_nc = "/home/zhe2/data/MyProjects/PACE_redSIF_PACE/convolved_transmittance/transmittance_winter_FineWvResModel_FullRange_Aug01.nc"
sif_file = "SIF_singular_vector.jld2"
pace_snr_file = "PACE_OCI_L1BLUT_baseline_SNR_1.1.txt"

# Adjustable fit window (bands kept if λ_min < band < λ_max)
[spectral]
lambda_min_nm = 665.0
lambda_max_nm = 715.0
sif_nev = 1
normalize_sif_first_ev = true

[fit]
use_band_snr = true
meas_sigma = 0.01
n_plot_steps = 50
conv_dx_rel_tol = 1.0e-6
conv_rmse_rel_tol = 1.0e-6
conv_rmse_abs_tol = 1.0e-6
lm_lambda0 = 1.0
lm_lambda_up = 5.0
lm_lambda_down = 0.7
lm_lambda_min = 1.0e-8
lm_lambda_max = 1.0e8
lm_max_inner = 40
conv_stall_enable = true
conv_stall_window = 3
conv_stall_redchi2_target = 5.0
conv_stall_redchi2_abs_tol = 0.1
conv_stall_redchi2_rel_tol = 0.03
conv_stall_dx_rel_tol = 5.0e-3
prior_min_sigma = 0.001
prior_sigma_default = 1.0e12
sif_sigma = 1.0e12

# Adjustable n_pc and Legendre polynomial order (n_legendre → coeffs p0…pN)
[fit.svd]
alpha_prior_mean = 1.5
alpha_prior_sigma = 0.5
n_legendre = 5
use_legendre01_prior = true
legendre01_prior_sigma_fraction = 1.0
use_legendre_higher_prior = true
legendre_higher_sigma = 1.0
n_pc = 15
svd_log_transform = true
pc_prior_mode = "loading_variance"
pc_prior_sigma_scale = 1.0

[batch_fit]
max_outer_steps = 10
