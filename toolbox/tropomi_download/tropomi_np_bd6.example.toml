# Example config for download_tropomi_np_bd6.py
# Usage: python download_tropomi_np_bd6.py tropomi_np_bd6.example.toml

[download.temporal]
start = "2025-07-02"
end   = "2025-07-31"

[download.spatial]
use_bounding_box = false
# bounding_box = [-180.0, -90.0, 180.0, 90.0]   # [west, south, east, north]

[download.collections]
# L1B radiance: short name is `S5P_L1B_RA_BD5_HiR`, version ["2", "3"]
# L2 radiance: short name is `S5P_L2__NP_BD6_HiR` 
short_name = "S5P_L1B_RA_BD5_HiR"
versions   = ["2", "3"]   # search both v2 and v3; use [""] to omit the version filter

[download.paths]
output_dir = "/kiwi-data/Data/groupMembers/zhe2/MyProjects/TROPOMI_SIF/ESA/L1"

[download.options]
skip_existing  = true     # skip files already on disk
login_strategy = "all"    # environment → netrc → interactive
